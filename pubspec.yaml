name: network_internet_checker
description: >-
  A Flutter widget that swaps your screen for a customisable "no internet"
  page when the device goes offline and restores it when it reconnects.
version: 1.2.0
homepage: https://github.com/Ogunleye-Similoluwa/network_internet-checker
repository: https://github.com/Ogunleye-Similoluwa/network_internet-checker
issue_tracker: https://github.com/Ogunleye-Similoluwa/network_internet-checker/issues
topics:
  - connectivity
  - network
  - internet
  - offline
  - widget

environment:
  sdk: '>=3.4.1 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: '>=6.0.1 <8.0.0'
  flutter_spinkit: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  assets:
    - assets/
