name: network_internet_checker
description: >-
  Detects real internet access, not just a network connection, and shows a
  customisable offline screen or banner that recovers automatically.
version: 1.2.0
homepage: https://github.com/Ogunleye-Similoluwa/network_internet-checker
repository: https://github.com/Ogunleye-Similoluwa/network_internet-checker
issue_tracker: https://github.com/Ogunleye-Similoluwa/network_internet-checker/issues
topics:
  - connectivity
  - network
  - internet
  - offline
  - widget

environment:
  sdk: '>=3.4.1 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: '>=6.0.1 <8.0.0'
  flutter_spinkit: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

screenshots:
  - description: Default offline screen in light mode
    path: screenshots/offline_light.png
  - description: Default offline screen in dark mode
    path: screenshots/offline_dark.png
  - description: OfflineBanner keeping the app usable while offline
    path: screenshots/banner.png

flutter:
  assets:
    - assets/
